    <meta charset="UTF-8">

    <title>DanielRov | Link Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffeef2 0%, #f3d5dc 50%, #e8becc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 100%;
            max-width: 430px;
            border-radius: 30px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(220, 160, 180, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Fixed Avatar Container to prevent image shifting */
        .avatar-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #ffd700, #ff9ebb);
            box-shadow: 0 8px 20px rgba(255, 158, 187, 0.4);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #fff;
        }

        h1 {
            font-size: 1.6rem;
            color: #4a2834;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .tag {
            display: inline-block;
            background: linear-gradient(135deg, #ff9ebb 0%, #ff83a0 100%);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(255, 131, 160, 0.2);
        }

        .bio {
            color: #6b4c57;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #4a2834;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(243, 213, 220, 0.8);
            box-shadow: 0 4px 15px rgba(232, 190, 204, 0.2);
        }

        /* Hover states for interactive touch feel */
        .link-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(90deg, #fff5f7 0%, #ffeef2 100%);
            border-color: #ff9ebb;
            box-shadow: 0 8px 20px rgba(255, 158, 187, 0.3);
        }

        .link-btn:active {
            transform: translateY(-1px);
        }

        /* Footer Attribution */
        .footer-text {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #a38590;
            letter-spacing: 1px;
        }
        /* Muonekano wa Kitufe cha Dark Mode */
.dark-mode-btn {
    padding: 10px 20px;
    font-size: 1rem;
    background-color: #ffffff;
    color: #333333;
    border: 2px solid #ffb6c1; /* Rangi ya pinki ya kifalme */
    border-radius: 20px;
    cursor: pointer;
    margin: 20px auto;
    display: block;
    font-weight: bold;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.dark-mode-btn:hover {
    background-color: #ffb6c1;
    color: #ffffff;
    transform: scale(1.05);
}
/* Rangi zitakazotokea zikiwa kwenye Dark Mode */
body.dark-theme {
    background: #1a1a1a !important;
    color: #ffffff !important;
}
body.dark-theme .container a {
    background-color: #22222a; /* Rangi ya giza ya ndani ya sanduku */
    color: #ffb6c1;            /* Rangi ya pinki ya Princess kwa ajili ya maandishi ya viungo */
    border: 2px solid #ffb6c1;  /* Mstari wa pembeni wa sanduku kuleta muonekano mzuri */
    padding: 14px;             /* Nafasi ya ndani ya sanduku */
    border-radius: 8px;        /* Kupinda kidogo kwa pembe za masanduku */
    text-decoration: none;     /* Kutoa ule mstari wa chini wa viungo vya kawaida */
    display: block;            /* Kufanya kiungo kijae kama sanduku */
    margin: 12px 0;            /* Nafasi kati ya sanduku moja na jingine */
    transition: all 0.3s ease; /* Kuweka ulaini wakati wa kugusa (hover) */
}

/* Na hii hapa chini ni ile athari wakati mtu anapoweka kipanya juu ya sanduku (Hover) */
body.dark-theme .container a:hover {
    background-color: #ffb6c1; /* Sanduku linabadilika na kujaa rangi ya pinki */
    color: #121212;            /* Maandishi yanakuwa meusi ili yasomeke vizuri sana */
    transform: scale(1.02);    /* Sanduku linajiongeza ukubwa kidogo kwa mbali */
}

<body>
<!-- Kitufe cha Dark Mode -->
<button id="dark-mode-toggle" class="dark-mode-btn">🌙 Dark Mode</button>
    <div class="container">
        <!-- Locked Profile Picture -->
        <div class="avatar-container">
            <!-- Replace the src URL with your chosen profile picture URL -->
            <img src="Screenshot_20261005_064135_BIGO LIVE.jpg" alt="Profile Avatar">
        </div>

        <h1>PRINCESS PIXIE</h1>
        <span class="tag">Digital Creator</span>
        
        <p class="bio">Living, Loving & Creating ✨<br>Catch my exclusive live streams and content below!</p>

        <!-- Solid Structural Links -->
        <div class="links-wrapper">
            <a href="YOUR_BIGO_LIVE_URL_HERE" class="link-btn" target="_blank">🌸 Watch My BIGO LIVE Stream</a>
            <a href="YOUR_INSTAGRAM_URL_HERE" class="link-btn" target="_blank">📸 Instagram Portfolio</a>
            <a href="YOUR_TIKTOK_URL_HERE" class="link-btn" target="_blank">🎬 TikTok Videos</a>
            <a href="YOUR_YOUTUBE_URL_HERE" class="link-btn" target="_blank">📺 My YouTube Channel</a>
        </div>

        <div class="footer-text">PRINCESS PIXIE</div>
    </div>
<!-- Kodi ya JavaScript ya Dark Mode -->
<script>
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    
    darkModeToggle.addEventListener('click', () => {
        // Hapa tunaambia website iongeze au iondoe mtindo wa 'dark-theme' kwenye body
        document.body.classList.toggle('dark-theme');
        
        // Hapa tunabadilisha maandishi ya kitufe kulingana na muonekano uliopo
        if (document.body.classList.contains('dark-theme')) {
            darkModeToggle.innerHTML = '☀️ Light Mode';
        } else {
            darkModeToggle.innerHTML = '🌙 Dark Mode';
        }
    });
</script>

</body>
